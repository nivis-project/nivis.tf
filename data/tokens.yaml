# The single source for every style value on the site.
#
# assets/css/tokens.css renders three rule sets from this one list: the light
# palette on :root, and the dark palette twice, once for an explicit choice and
# once for a system preference. Generating both from here is what stops them
# drifting; tests/checks/tokens.sh proves it by parsing the generated CSS.
#
# A token with no `dark:` key is identical in both themes and is emitted once.

colors:
  # One analogous family, teal through to deep blue. The brand brief gives the
  # anchors in hex: teal #2DD2C5, sky #2D8DD2, deep blue #2D3AD2. Those convert
  # to oklch hues 186.6, 244.8 and 269.8, which is the range every token below
  # sits inside. oklch rather than the brief's HSL because the whole pipeline
  # and every contrast assertion already speak it; the rendered colours are the
  # same.
  #
  # Text tokens are deliberately NOT the raw anchors. The brief says as much:
  # the swatches are fine for large shapes but must meet WCAG AA as text, and
  # teal on white is 1.89:1. tests/checks/contrast.py computes every pairing.
  - { name: ground,       light: "oklch(0.985 0.006 230)", dark: "oklch(0.17 0.035 255)", role: "page background, cards on surface" }
  - { name: surface,      light: "oklch(0.998 0.003 230)", dark: "oklch(0.21 0.04 255)",  role: "alternating section background, table" }
  - { name: ink,          light: "oklch(0.26 0.05 258)",   dark: "oklch(0.94 0.015 230)", role: "text" }
  - { name: muted,        light: "oklch(0.46 0.04 252)",   dark: "oklch(0.77 0.035 230)", role: "secondary text" }
  - { name: line,         light: "oklch(0.88 0.02 240)",   dark: "oklch(0.34 0.045 250)", role: "borders, dividers" }
  - { name: accent,       light: "oklch(0.45 0.19 265)",   dark: "oklch(0.80 0.12 230)",  role: "links, outline button border" }
  - { name: accent-soft,  light: "oklch(0.93 0.045 235)",  dark: "oklch(0.30 0.07 250)",  role: "highlighted table column" }
  - { name: cta,          light: "oklch(0.455 0.228 270)", dark: "oklch(0.54 0.19 262)",  role: "primary buttons, step numbers; fill only" }
  - { name: on-cta,       light: "oklch(0.99 0.004 230)",                                 role: "text on the primary fill" }
  - { name: code-bg,      light: "oklch(0.24 0.045 258)",  dark: "oklch(0.13 0.03 258)",  role: "code block background" }
  - { name: code-ink,     light: "oklch(0.93 0.015 230)",                                 role: "code text" }
  - { name: code-dim,     light: "oklch(0.76 0.045 225)",                                 role: "comments, shell prompt" }
  - { name: band-bg,      light: "oklch(0.30 0.10 258)",   dark: "oklch(0.26 0.09 258)",  role: "round-trip section background" }
  - { name: band-ink,     light: "oklch(0.97 0.012 220)",                                 role: "text on band" }
  - { name: band-muted,   light: "oklch(0.86 0.045 215)",                                 role: "secondary text on band" }
  - { name: band-line,    light: "oklch(0.50 0.09 250)",                                  role: "card borders on band" }
  - { name: band-code,    light: "oklch(0.21 0.06 258)",   dark: "oklch(0.17 0.05 258)",  role: "code block on band" }
  # Syntax colours spread across the family's full hue range, so four tokens in
  # one analogous family stay distinguishable. All sit on the dark code ground.
  - { name: tok-keyword,  light: "oklch(0.80 0.13 268)",                                  role: "syntax: keywords" }
  - { name: tok-string,   light: "oklch(0.85 0.12 190)",                                  role: "syntax: strings" }
  - { name: tok-func,     light: "oklch(0.83 0.11 235)",                                  role: "syntax: functions, commands" }
  - { name: tok-literal,  light: "oklch(0.89 0.085 210)",                                 role: "syntax: booleans, numbers" }

# The mark's colours are a function of a copy's position in the series, so they
# cannot be three fixed tokens. The brief gives the rule directly, in HSL:
#
#   hue = 205 + (i / (N - 1) - 0.5) * 60,  saturation 65%, lightness 50%
#
# which spreads an analogous teal-to-blue family evenly across however many
# copies a mark draws. assets/css/tokens.css emits one token per (copies, index)
# pair from this, so every colour value still lives only in the token source and
# the mark partial only ever writes var(--mark-N-i).
#
# HSL, not oklch, because the formula is defined there: the brief's palette is
# evenly spaced in HSL, and interpolating the same endpoints in oklch misses the
# middle steps by about a third of their chroma.
mark_span:
  hue_centre: 205
  hue_spread: 60
  saturation: 65
  lightness: 50
  max_copies: 7

