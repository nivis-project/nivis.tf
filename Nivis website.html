  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ccent:oklch(0.17 0.03 275);--accent-soft:oklch(0.3 0.07 275);\n--code-bg:oklch(0.13 0.025 275);--band-bg:oklch(0.23 0.08 275);--band-code:oklch(0.15 0.04 275);\n--mark-a:oklch(0.72 0.13 250);--mark-b:oklch(0.7 0.16 305);--mark-core:oklch(0.82 0.1 275);\n}\n@media (prefers-color-scheme: dark){.nv[data-theme=\"auto\"]{\n--ground:oklch(0.17 0.03 275);--surface:oklch(0.21 0.035 275);--ink:oklch(0.94 0.012 275);--muted:oklch(0.76 0.035 275);--line:oklch(0.34 0.04 275);\n--accent:oklch(0.78 0.12 275);--on-accent:oklch(0.17 0.03 275);--accent-soft:oklch(0.3 0.07 275);\n--code-bg:oklch(0.13 0.025 275);--band-bg:oklch(0.23 0.08 275);--band-code:oklch(0.15 0.04 275);\n--mark-a:oklch(0.72 0.13 250);--mark-b:oklch(0.7 0.16 305);--mark-core:oklch(0.82 0.1 275);\n}}\n.nv pre .k{color:oklch(0.8 0.13 320)}.nv pre .s{color:oklch(0.85 0.11 160)}.nv pre .f{color:oklch(0.83 0.1 240)}.nv pre .n{color:oklch(0.85 0.12 78)}\n.nv a{color:var(--accent)}.nv a:hover{color:var(--ink)}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"nv\" data-theme=\"{{theme}}\" style=\"background: var(--ground); color: var(--ink); font-family: Hind, 'Segoe UI', system-ui, sans-serif; font-size: 18px; line-height: 1.55\" data-canvas-width=\"1280\" data-canvas-height=\"6900\">\n\n<header style=\"max-width: 1120px; margin: 0 auto; padding: 24px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px\">\n<a href=\"#top\" aria-label=\"Nivis home\" style=\"display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink)\">\n<svg sc-camel-view-box=\"-100 -100 200 200\" width=\"40\" height=\"40\" aria-hidden=\"true\">\n<path d=\"{{m.l0}}\" style=\"fill: var(--mark-a)\" fill-opacity=\"0.34\"><\u002Fpath>\n<path d=\"{{m.l1}}\" style=\"fill: var(--mark-b)\" fill-opacity=\"0.34\"><\u002Fpath>\n<path d=\"{{m.l2}}\" style=\"fill: var(--mark-a)\" fill-opacity=\"0.34\"><\u002Fpath>\n<path d=\"{{m.l3}}\" style=\"fill: var(--mark-b)\" fill-opacity=\"0.34\"><\u002Fpath>\n<path d=\"{{m.core}}\" style=\"fill: var(--mark-core)\"><\u002Fpath>\n<\u002Fsvg>\n<span style=\"font-size: 34px; font-weight: 400; line-height: 1; letter-spacing: -0.01em; padding-top: 4px\">Nivis<\u002Fspan>\n<\u002Fa>\n<nav aria-label=\"Main\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 4px 28px; font-size: 17px\">\n<a href=\"#start\" style=\"text-decoration: none; padding: 10px 0; color: var(--muted)\">Quick start<\u002Fa>\n<a href=\"#roundtrip\" style=\"text-decoration: none; padding: 10px 0; color: var(--muted)\">Round trip<\u002Fa>\n<a href=\"#compare\" style=\"text-decoration: none; padding: 10px 0; color: var(--muted)\">Compare<\u002Fa>\n<a href=\"#projects\" style=\"text-decoration: none; padding: 10px 0; color: var(--muted)\">Projects<\u002Fa>\n<a href=\"https://github.com/nivis-project\" style=\"text-decoration: none; padding: 9px 18px; border: 1.5px solid var(--accent); border-radius: 999px; color: var(--ink); font-weight: 500\">GitHub<\u002Fa>\n<button sc-camel-on-click=\"{{toggleTheme}}\" aria-label=\"Switch between light and dark\" style=\"width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0\">\n<svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"8.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M12 3.5a8.5 8.5 0 0 1 0 17z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<\u002Fnav>\n<\u002Fheader>\n\n<main id=\"top\">\n\n<section style=\"max-width: 1120px; margin: 0 auto; padding: 56px 24px 88px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 48px; align-items: center\">\n<div style=\"display: flex; flex-direction: column; gap: 24px; align-items: flex-start\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px\">early but real · Apache-2.0<\u002Fdiv>\n<h1 style=\"margin: 0; font-size: clamp(40px, 5.6vw, 68px); line-height: 1.04; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance\">Terraform providers as first-class Nix values.<\u002Fh1>\n<p style=\"margin: 0; font-size: 21px; line-height: 1.5; color: var(--muted); max-width: 34em; text-wrap: pretty\">Describe real infrastructure in a flake instead of HCL. A thin Go executor drives unmodified Terraform and OpenTofu provider binaries, and what the cloud returns flows back into Nix.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center\">\n<a href=\"#start\" style=\"text-decoration: none; background: var(--warm); color: var(--on-warm); padding: 13px 26px; border-radius: 999px; font-weight: 500; font-size: 18px\">Try it in five minutes<\u002Fa>\n<a href=\"#roundtrip\" style=\"padding: 13px 4px; font-size: 18px\">How the round trip works<\u002Fa>\n<\u002Fdiv>\n<pre style=\"align-self: stretch; background: var(--code-bg); color: var(--code-ink); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; line-height: 1.6; padding: 16px 20px; border-radius: 10px; overflow-x: auto\"><span style=\"color: var(--code-dim)\">$ <\u002Fspan><span class=\"f\">nix<\u002Fspan>run github:nivis-project/nivis#nivis -- --version<\u002Fpre>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: center\">\n<svg sc-camel-view-box=\"-100 -100 200 200\" role=\"img\" aria-label=\"The Nivis mark: layered shapes drawn from h(θ) = a + b · cos 3θ\" style=\"width: 100%; max-width: 440px; height: auto\">\n<path d=\"{{m.l0}}\" style=\"fill: var(--mark-a)\" fill-opacity=\"0.3\"><\u002Fpath>\n<path d=\"{{m.l1}}\" style=\"fill: var(--mark-b)\" fill-opacity=\"0.3\"><\u002Fpath>\n<path d=\"{{m.l2}}\" style=\"fill: var(--mark-a)\" fill-opacity=\"0.3\"><\u002Fpath>\n<path d=\"{{m.l3}}\" style=\"fill: var(--mark-b)\" fill-opacity=\"0.3\"><\u002Fpath>\n<path d=\"{{m.core}}\" style=\"fill: var(--mark-core)\"><\u002Fpath>\n<\u002Fsvg>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"h-from\" style=\"background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line)\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 40px\">\n<h2 id=\"h-from\" style=\"margin: 0; font-size: 38px; line-height: 1.15; font-weight: 600; letter-spacing: -0.015em\">You already know half of it.<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 24px\">\n<div style=\"background: var(--ground); border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 600\">Coming from Nix<\u002Fh3>\n<p style=\"margin: 0; color: var(--muted)\">The missing half is the provider ecosystem.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 12px\">\n<li>A <strong>provider<\u002Fstrong> is a plugin binary that speaks to one cloud API. Nivis runs any OpenTofu-compatible provider as-is.<\u002Fli>\n<li><strong>plan<\u002Fstrong> previews what would change, <strong>apply<\u002Fstrong> makes it so, and <strong>state<\u002Fstrong> remembers what exists.<\u002Fli>\n<li>A resource is an attrset built with <code style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.86em\">mkResource<\u002Fcode>. Compose it with the functions and modules you already write.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<div style=\"background: var(--ground); border-radius: 14px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 600\">Coming from Terraform<\u002Fh3>\n<p style=\"margin: 0; color: var(--muted)\">The missing half is the language.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 12px\">\n<li>Same providers, same <strong>plan / apply / destroy<\u002Fstrong>. A <code style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.86em\">flake.nix<\u002Fcode> takes the place of your <code style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.86em\">.tf<\u002Fcode> files.<\u002Fli>\n<li><code style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.86em\">aws_s3_bucket.demo.id<\u002Fcode> becomes <code style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.86em\">bucket.refAttr \"id\"<\u002Fcode>, an ordinary value you can pass to any function.<\u002Fli>\n<li>Nix also builds machines. A NixOS image and the cloud resources that boot it can live in one expression.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: var(--muted)\">main.tf<\u002Fdiv>\n<pre style=\"flex-grow: 1; background: var(--code-bg); color: var(--code-ink); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.65; padding: 20px 22px; border-radius: 10px; overflow-x: auto\"><span class=\"k\">provider<\u002Fspan> <span class=\"s\">\"aws\"<\u002Fspan> {\n  region = <span class=\"s\">\"eu-central-1\"<\u002Fspan>\n}\n\n<span class=\"k\">resource<\u002Fspan> <span class=\"s\">\"aws_s3_bucket\"<\u002Fspan> <span class=\"s\">\"demo\"<\u002Fspan> {\n  force_destroy = <span class=\"n\">true<\u002Fspan>\n}<\u002Fpre>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px; min-width: 0\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: var(--muted)\">flake.nix (excerpt)<\u002Fdiv>\n<pre style=\"flex-grow: 1; background: var(--code-bg); color: var(--code-ink); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.65; padding: 20px 22px; border-radius: 10px; overflow-x: auto\">providers.aws = <span class=\"f\">lib.mkProvider<\u002Fspan> {\n  source = <span class=\"s\">\"registry.opentofu.org/hashicorp/aws\"<\u002Fspan>;\n  config.region = <span class=\"s\">\"eu-central-1\"<\u002Fspan>;\n};\nresources = [\n  (<span class=\"f\">lib.mkResource<\u002Fspan> {\n    provider = <span class=\"s\">\"aws\"<\u002Fspan>; type = <span class=\"s\">\"aws_s3_bucket\"<\u002Fspan>; name = <span class=\"s\">\"demo\"<\u002Fspan>;\n    config.force_destroy = <span class=\"n\">true<\u002Fspan>;\n  })\n];<\u002Fpre>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"start\" aria-labelledby=\"h-start\" style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<h2 id=\"h-start\" style=\"margin: 0; font-size: 38px; line-height: 1.15; font-weight: 600; letter-spacing: -0.015em\">Quick start<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted); max-width: 40em\">All you need is Nix with flakes enabled. The first two steps touch no cloud account.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 16px\">\n<div aria-hidden=\"true\" style=\"width: 40px; height: 40px; border-radius: 50%; background: var(--warm); color: var(--on-warm); display: flex; align-items: center; justify-content: center; font-weight: 600; padding-top: 2px; box-sizing: border-box\">1<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px; min-width: 0\">\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 600; padding-top: 4px\">Run it without cloning<\u002Fh3>\n<pre style=\"background: var(--code-bg); color: var(--code-ink); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.65; padding: 18px 22px; border-radius: 10px; overflow-x: auto\"><span style=\"color: var(--code-dim)\">$ <\u002Fspan><span class=\"f\">nix<\u002Fspan>run github:nivis-project/nivis#nivis -- --version<\u002Fpre>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 16px\">\n<div aria-hidden=\"true\" style=\"width: 40px; height: 40px; border-radius: 50%; background: var(--warm); color: var(--on-warm); display: flex; align-items: center; justify-content: center; font-weight: 600; padding-top: 2px; box-sizing: border-box\">2<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px; min-width: 0\">\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 600; padding-top: 4px\">Take the guided tour<\u002Fh3>\n<p style=\"margin: 0; color: var(--muted); max-width: 40em\"><code style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.86em\">nivistutor<\u002Fcode> scaffolds a sandboxed tutorial project, so you can watch a plan and an apply before any credentials are involved.<\u002Fp>\n<pre style=\"background: var(--code-bg); color: var(--code-ink); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.65; padding: 18px 22px; border-radius: 10px; overflow-x: auto\"><span style=\"color: var(--code-dim)\">$ <\u002Fspan><span class=\"f\">nix<\u002Fspan>shell github:nivis-project/nivis#nivis github:nivis-project/nivis#tutor\n<span style=\"color: var(--code-dim)\">$ <\u002Fspan><span class=\"f\">nivistutor<\u002Fspan><\u002Fpre>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 16px\">\n<div aria-hidden=\"true\" style=\"width: 40px; height: 40px; border-radius: 50%; background: var(--warm); color: var(--on-warm); display: flex; align-items: center; justify-content: center; font-weight: 600; padding-top: 2px; box-sizing: border-box\">3<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px; min-width: 0\">\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 600; padding-top: 4px\">Write a flake<\u002Fh3>\n<p style=\"margin: 0; color: var(--muted); max-width: 40em\">One provider, one resource. This is a complete <code style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.86em\">flake.nix<\u002Fcode>.<\u002Fp>\n<pre style=\"background: var(--code-bg); color: var(--code-ink); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.65; padding: 20px 22px; border-radius: 10px; overflow-x: auto\">{\n  inputs.nivis.url = <span class=\"s\">\"github:nivis-project/nivis\"<\u002Fspan>;\n  outputs = { self, nivis }:\n    <span class=\"k\">let<\u002Fspan> lib = nivis.lib; <span class=\"k\">in<\u002Fspan> {\n      nivis.plan = ledger: <span class=\"f\">lib.toIR<\u002Fspan> {\n        providers.aws = <span class=\"f\">lib.mkProvider<\u002Fspan> {\n          source = <span class=\"s\">\"registry.opentofu.org/hashicorp/aws\"<\u002Fspan>;\n          config.region = <span class=\"s\">\"eu-central-1\"<\u002Fspan>;\n        };\n        resources = [\n          (<span class=\"f\">lib.mkResource<\u002Fspan> {\n            provider = <span class=\"s\">\"aws\"<\u002Fspan>; type = <span class=\"s\">\"aws_s3_bucket\"<\u002Fspan>; name = <span class=\"s\">\"demo\"<\u002Fspan>;\n            config.force_destroy = <span class=\"n\">true<\u002Fspan>;\n          })\n        ];\n        <span class=\"k\">inherit<\u002Fspan> ledger;\n      };\n    };\n}<\u002Fpre>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 16px\">\n<div aria-hidden=\"true\" style=\"width: 40px; height: 40px; border-radius: 50%; background: var(--warm); color: var(--on-warm); display: flex; align-items: center; justify-content: center; font-weight: 600; padding-top: 2px; box-sizing: border-box\">4<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px; min-width: 0\">\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 600; padding-top: 4px\">Plan, apply, inspect, destroy<\u002Fh3>\n<p style=\"margin: 0; color: var(--muted); max-width: 40em\">From here on you are creating real resources in your own AWS account.<\u002Fp>\n<pre style=\"background: var(--code-bg); color: var(--code-ink); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.65; padding: 18px 22px; border-radius: 10px; overflow-x: auto\"><span style=\"color: var(--code-dim)\">$ <\u002Fspan><span class=\"f\">nivis<\u002Fspan> plan                              <span style=\"color: var(--code-dim)\">\n# preview changes\n<\u002Fspan><span style=\"color: var(--code-dim)\">$ <\u002Fspan><span class=\"f\">nivis <\u002Fspan>apply                             <span style=\"color: var(--code-dim)\">\n# apply to fixpoint<\u002Fspan><span style=\"color: var(--code-dim)\">\n$ <\u002Fspan><span class=\"f\">nivis <\u002Fspan>state show aws.aws_s3_bucket.demo\n<span style=\"color: var(--code-dim)\">$ <\u002Fspan><span class=\"f\">nivis<\u002Fspan> destroy<\u002Fpre>\n<p style=\"margin: 0\"><a href=\"https://github.com/nivis-project/nivis/blob/HEAD/docs/GETTING-STARTED.md\">Read the full getting-started guide<\u002Fa><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"roundtrip\" aria-labelledby=\"h-rt\" style=\"background: var(--band-bg); color: var(--band-ink)\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<h2 id=\"h-rt\" style=\"margin: 0; font-size: 38px; line-height: 1.15; font-weight: 600; letter-spacing: -0.015em\">The round trip<\u002Fh2>\n<p style=\"margin: 0; color: var(--band-muted); max-width: 40em; font-size: 20px; text-wrap: pretty\">A provider creates a resource and returns values nobody could know beforehand: an IP, an ID, a generated name. Nivis hands those back to Nix and evaluates again, until nothing is left unknown.<\u002Fp>\n<\u002Fdiv>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 16px\">\n<li style=\"border: 1px solid var(--band-line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: var(--band-muted)\">01 evaluate<\u002Fdiv>\n<div>Nix evaluates your flake to a JSON plan. Values that only exist after apply become typed placeholders.<\u002Fdiv>\n<\u002Fli>\n<li style=\"border: 1px solid var(--band-line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: var(--band-muted)\">02 apply<\u002Fdiv>\n<div>The executor applies everything that is fully known, speaking the plugin protocol to the provider binaries.<\u002Fdiv>\n<\u002Fli>\n<li style=\"border: 1px solid var(--band-line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: var(--band-muted)\">03 ledger<\u002Fdiv>\n<div>Whatever the providers computed is collected in the ledger.<\u002Fdiv>\n<\u002Fli>\n<li style=\"border: 1px solid var(--band-line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; color: var(--band-muted)\">04 re-evaluate<\u002Fdiv>\n<div>Nix runs again with the ledger as input. Placeholders resolve, the next phase unlocks, and the loop repeats to a fixpoint.<\u002Fdiv>\n<\u002Fli>\n<\u002Fol>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 32px; align-items: center\">\n<pre style=\"min-width: 0; background: var(--band-code); color: var(--code-ink); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14.5px; line-height: 1.65; padding: 20px 22px; border-radius: 10px; overflow-x: auto\">note = <span class=\"f\">lib.mkResource<\u002Fspan> {\n  provider = <span class=\"s\">\"aws\"<\u002Fspan>;\n  type = <span class=\"s\">\"aws_s3_object\"<\u002Fspan>;\n  name = <span class=\"s\">\"note\"<\u002Fspan>;\n  config = {\n    bucket = <span class=\"f\">bucket.refAttr<\u002Fspan> <span class=\"s\">\"id\"<\u002Fspan>;\n    key = <span class=\"s\">\"hello-from-nix.txt\"<\u002Fspan>;\n    content = <span class=\"f\">lib.str<\u002Fspan> [\n      <span class=\"s\">\"This file's content was generated by Nix.\\n\"<\u002Fspan>\n      <span class=\"s\">\"It is stored in the bucket named: \"<\u002Fspan>\n      (<span class=\"f\">bucket.refAttr<\u002Fspan> <span class=\"s\">\"id\"<\u002Fspan>)\n      <span class=\"s\">\"\\n\"<\u002Fspan>\n    ];\n    content_type = <span class=\"s\">\"text/plain\"<\u002Fspan>;\n  };\n};<\u002Fpre>\n<div style=\"display: flex; flex-direction: column; gap: 16px\">\n<h3 style=\"margin: 0; font-size: 24px; font-weight: 600\">A file whose content depends on a name AWS has yet to invent<\u002Fh3>\n<p style=\"margin: 0; color: var(--band-muted)\">The bucket id does not exist until phase one has run. In phase two Nix builds the string around it, and the result becomes the body of a real S3 object.<\u002Fp>\n<p style=\"margin: 0\"><a href=\"https://github.com/nivis-project/nivis/blob/HEAD/docs/TUTORIAL-AWS-S3.md\" style=\"color: var(--band-ink)\">Follow the AWS S3 tutorial<\u002Fa><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"compare\" aria-labelledby=\"h-cmp\" style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 32px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<h2 id=\"h-cmp\" style=\"margin: 0; font-size: 38px; line-height: 1.15; font-weight: 600; letter-spacing: -0.015em\">Where Nivis sits<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted); max-width: 40em\">Terranix generates HCL from Nix and hands it to Terraform. Pulumi compiles providers through a bridge. Nivis keeps resources as Nix values and spawns the providers untouched.<\u002Fp>\n<\u002Fdiv>\n<div style=\"overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface)\">\n<sc-raw-table style=\"width: 100%; min-width: 860px; border-collapse: collapse; font-size: 16px; line-height: 1.4\">\n<sc-raw-thead>\n<sc-raw-tr>\n<sc-raw-th scope=\"col\" style=\"text-align: left; padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 500; color: var(--muted); width: 24%\"><\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: left; padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 600; background: var(--accent-soft)\">Nivis<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: left; padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 600\">OpenTofu / Terraform<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: left; padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 600\">Terranix<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: left; padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 600\">NixOps 4<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: left; padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 600\">Pulumi<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr>\n<sc-raw-th scope=\"row\" style=\"text-align: left; padding: 14px 20px; border-bottom: 1px solid var(--line); font-weight: 500\">Config language<\u002Fsc-raw-th>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--accent-soft); font-weight: 600\">Nix<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">HCL<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">Nix → HCL<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">Nix<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">TS, Python, Go, …<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr>\n<sc-raw-th scope=\"row\" style=\"text-align: left; padding: 14px 20px; border-bottom: 1px solid var(--line); font-weight: 500\">Reuses Terraform / OpenTofu providers<\u002Fsc-raw-th>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--accent-soft); font-weight: 600\">Yes, spawned unmodified<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">Yes, native<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">Yes, via Terraform<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line); color: var(--muted)\">In progress<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">Yes, via bridge<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr>\n<sc-raw-th scope=\"row\" style=\"text-align: left; padding: 14px 20px; border-bottom: 1px solid var(--line); font-weight: 500\">Outputs feed back into config<\u002Fsc-raw-th>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--accent-soft); font-weight: 600\">Yes, phased re-evaluation<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line); color: var(--muted)\">Partly: HCL references only<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line); color: var(--muted)\">No<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">Yes<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">Yes, Output&lt;T&gt;<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr>\n<sc-raw-th scope=\"row\" style=\"text-align: left; padding: 14px 20px; border-bottom: 1px solid var(--line); font-weight: 500\">Plan before apply<\u002Fsc-raw-th>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--accent-soft); font-weight: 600\">Yes<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">Yes<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">Yes, via Terraform<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line); color: var(--muted)\">Partly<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">Yes<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr>\n<sc-raw-th scope=\"row\" style=\"text-align: left; padding: 14px 20px; border-bottom: 1px solid var(--line); font-weight: 500\">OS build and cloud in one expression<\u002Fsc-raw-th>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--accent-soft); font-weight: 600\">Yes, NixOS image → AMI<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line); color: var(--muted)\">No<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line); color: var(--muted)\">No<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line)\">Yes<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px; border-bottom: 1px solid var(--line); color: var(--muted)\">No<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr>\n<sc-raw-th scope=\"row\" style=\"text-align: left; padding: 14px 20px; font-weight: 500\">License<\u002Fsc-raw-th>\n<sc-raw-td style=\"padding: 14px 20px; background: var(--accent-soft); font-weight: 600\">Apache-2.0<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px\">MPL-2.0 / BUSL-1.1<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px\">MIT<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px\">LGPL-2.1<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 14px 20px\">Apache-2.0 core<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<p style=\"margin: 0\"><a href=\"https://github.com/nivis-project/nivis/blob/HEAD/docs/COMPARISON.md\">Read the full comparison, including CDK and CloudFormation<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section id=\"projects\" aria-labelledby=\"h-proj\" style=\"background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line)\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<h2 id=\"h-proj\" style=\"margin: 0; font-size: 38px; line-height: 1.15; font-weight: 600; letter-spacing: -0.015em\">The Nivis projects<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted); max-width: 40em\">Every mark is the same curve, <span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 0.86em\">h(θ) = a + b · cos kθ<\u002Fspan>, with different parameters.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 20px\">\n<sc-for list=\"{{projects}}\" as=\"p\" hint-placeholder-count=\"6\">\n<a href=\"{{p.url}}\" style=\"text-decoration: none; color: var(--ink); background: var(--ground); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<svg sc-camel-view-box=\"-100 -100 200 200\" width=\"64\" height=\"64\" aria-hidden=\"true\">\n<path d=\"{{p.d0}}\" style=\"fill: var(--mark-a)\" fill-opacity=\"0.35\"><\u002Fpath>\n<path d=\"{{p.d1}}\" style=\"fill: var(--mark-b)\" fill-opacity=\"0.35\"><\u002Fpath>\n<path d=\"{{p.d2}}\" style=\"fill: var(--mark-core)\"><\u002Fpath>\n<\u002Fsvg>\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px\">\n<span style=\"font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 17px; font-weight: 500\">{{p.name}}<\u002Fspan>\n<span style=\"font-size: 14px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px\">{{p.status}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"color: var(--muted); font-size: 17px\">{{p.text}}<\u002Fdiv>\n<\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"h-docs\" style=\"max-width: 1120px; margin: 0 auto; padding: 88px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 40px; align-items: start\">\n<div style=\"display: flex; flex-direction: column; gap: 20px; align-items: flex-start\">\n<h2 id=\"h-docs\" style=\"margin: 0; font-size: 38px; line-height: 1.15; font-weight: 600; letter-spacing: -0.015em\">Go deeper<\u002Fh2>\n<p style=\"margin: 0; color: var(--muted); max-width: 30em\">Nivis is early. The round trip works across providers, and AWS applies, updates, replaces and destroys today. Issues and experiments are welcome.<\u002Fp>\n<a href=\"#start\" style=\"text-decoration: none; background: var(--warm); color: var(--on-warm); padding: 13px 26px; border-radius: 999px; font-weight: 500\">Try it in five minutes<\u002Fa>\n<\u002Fdiv>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 0 32px; font-size: 19px\">\n<li style=\"border-top: 1px solid var(--line)\"><a href=\"https://github.com/nivis-project/nivis/blob/HEAD/docs/INSTALL.md\" style=\"display: block; padding: 13px 0; text-decoration: none\">Installation<\u002Fa><\u002Fli>\n<li style=\"border-top: 1px solid var(--line)\"><a href=\"https://github.com/nivis-project/nivis/blob/HEAD/docs/OVERVIEW.md\" style=\"display: block; padding: 13px 0; text-decoration: none\">Overview<\u002Fa><\u002Fli>\n<li style=\"border-top: 1px solid var(--line)\"><a href=\"https://github.com/nivis-project/nivis/blob/HEAD/docs/DESIGN.md\" style=\"display: block; padding: 13px 0; text-decoration: none\">Design<\u002Fa><\u002Fli>\n<li style=\"border-top: 1px solid var(--line)\"><a href=\"https://github.com/nivis-project/nivis/blob/HEAD/docs/DATASOURCES.md\" style=\"display: block; padding: 13px 0; text-decoration: none\">Data sources<\u002Fa><\u002Fli>\n<li style=\"border-top: 1px solid var(--line)\"><a href=\"https://github.com/nivis-project/nivis/blob/HEAD/docs/IR-CONTRACT.md\" style=\"display: block; padding: 13px 0; text-decoration: none\">IR contract<\u002Fa><\u002Fli>\n<li style=\"border-top: 1px solid var(--line)\"><a href=\"https://github.com/nivis-project/nivis-demos\" style=\"display: block; padding: 13px 0; text-decoration: none\">Demos<\u002Fa><\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer style=\"border-top: 1px solid var(--line)\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px; font-size: 16px; color: var(--muted)\">\n<div style=\"display: flex; align-items: center; gap: 10px\">\n<svg sc-camel-view-box=\"-100 -100 200 200\" width=\"26\" height=\"26\" aria-hidden=\"true\">\n<path d=\"{{m.l1}}\" style=\"fill: var(--mark-b)\" fill-opacity=\"0.3\"><\u002Fpath>\n<path d=\"{{m.l2}}\" style=\"fill: var(--mark-a)\" fill-opacity=\"0.3\"><\u002Fpath>\n<path d=\"{{m.core}}\" style=\"fill: var(--mark-core)\"><\u002Fpath>\n<\u002Fsvg>\n<span>Nivis · Apache-2.0 · nivis.tf<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 4px 24px\">\n<a href=\"https://github.com/nivis-project\" style=\"padding: 10px 0\">GitHub<\u002Fa>\n<a href=\"https://github.com/nivis-project/nivis/issues\" style=\"padding: 10px 0\">Issues<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;lobes&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:2,&quot;max&quot;:7,&quot;section&quot;:&quot;Mark&quot;},&quot;amplitude&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2.5,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Mark&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:6900}}\">\nclass Component extends DCLogic {\n  // h(θ) = a + b · cos kθ, with b = a · amp / (k² + 1); amp = 1 gives flat sides.\n  blob(a, k, amp, rotDeg) {\n    var b = a * amp / (k * k + 1);\n    var rot = rotDeg * Math.PI / 180;\n    var n = 120, d = '';\n    for (var i = 0; i < n; i++) {\n      var t = 2 * Math.PI * i / n;\n      var r = a + b * Math.cos(k * t);\n      d += (i ? 'L' : 'M') + (r * Math.cos(t + rot)).toFixed(1) + ' ' + (r * Math.sin(t + rot)).toFixed(1);\n    }\n    return d + 'Z';\n  }\n  renderVals() {\n    var self = this;\n    var k = this.props.lobes ?? 3;\n    var amp = this.props.amplitude ?? 1;\n    var m = {\n      l0: this.blob(84, k, amp, -24),\n      l1: this.blob(80, k, amp, -11),\n      l2: this.blob(78, k, amp, 12),\n      l3: this.blob(74, k, amp, 25),\n      core: this.blob(64, k, amp, 0)\n    };\n    var gh = 'https://github.com/nivis-project/';\n    var projects = [\n      { name: 'nivis', status: 'early but real', k: 3, amp: amp, rot: 0, text: 'The library and executor. Provider resources as Nix values, applied to a fixpoint.' },\n      { name: 'registry', status: 'alpha', k: 4, amp: 1.2, rot: 45, text: 'A browsable catalog of OpenTofu-compatible providers with Nix-native documentation.' },\n      { name: 'nivis-tunnel', status: 'proof of concept', k: 2, amp: 1.6, rot: 0, text: 'Deploy NixOS closures to machines with no inbound ports, over a Noise-encrypted relay.' },\n      { name: 'nivis-demos', status: 'examples', k: 5, amp: 1.4, rot: -18, text: 'Small reproducible stacks: state bootstrap, one NixOS workload on two clouds, tunnel deploys.' },\n      { name: 'terraform-provider-nivis-tunnel', status: 'provider', k: 2, amp: 1.6, rot: 90, text: 'Terraform provider for the Nivis deployment tunnel.' },\n      { name: 'terraform-provider-hcloudimage', status: 'provider', k: 3, amp: 1.8, rot: 180, text: 'Upload raw disk images to Hetzner Cloud from Terraform or OpenTofu.' }\n    ].map(function (p) {\n      return {\n        name: p.name, status: p.status, text: p.text, url: gh + p.name,\n        d0: self.blob(84, p.k, p.amp, p.rot - 16),\n        d1: self.blob(80, p.k, p.amp, p.rot + 16),\n        d2: self.blob(64, p.k, p.amp, p.rot)\n      };\n    });\n    var theme = (this.state && this.state.theme) || this.props.theme || 'auto';\n    var toggleTheme = function () {\n      var dark = theme === 'dark' || (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);\n      self.setState({ theme: dark ? 'light' : 'dark' });\n    };\n    return { m: m, projects: projects, theme: theme, toggleTheme: toggleTheme };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
