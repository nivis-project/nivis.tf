version: 1
frontend:
  phases:
    preBuild:
      commands:
        # The Hugo version lives in .hugo-version and nowhere else. The flake's
        # hugo-version-pin check fails when nixpkgs drifts away from it, so this
        # file never carries a second copy of the number.
        - HUGO_VERSION="$(cat .hugo-version)"
        - curl -sSL -o /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
        - tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
        - /tmp/hugo version
    build:
      commands:
        - /tmp/hugo --minify
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - resources/_gen/**/*
