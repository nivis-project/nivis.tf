{{- /*
  The preview image, generated from the same mark partial as the favicon, so
  recolouring the tokens moves it too.

  SVG is an unusual choice for a social image and several platforms will not
  render it. The alternatives were worse: rasterising needs a new build
  dependency and failure mode, and hand-exporting a PNG would be the one asset
  that silently stayed behind when the mark changed. Recorded in the README.
*/ -}}
{{- $site := hugo.Data.site -}}
{{- $mark := partial "mark.html" (dict "name" "nivis" "variant" "full") -}}
{{- $colors := dict -}}
{{- range hugo.Data.tokens.colors -}}
{{- if or (hasPrefix .name "mark-") (eq .name "ground") (eq .name "ink") (eq .name "muted") -}}
{{- $colors = merge $colors (dict .name .light) -}}
{{- end -}}
{{- end -}}
{{- $inner := $mark -}}
{{- range $n, $v := $colors -}}
{{- $inner = replace $inner (printf "var(--%s)" $n) $v -}}
{{- end -}}
{{- $inner = replace $inner "<svg viewBox=\"-100 -100 200 200\"" "<svg x=\"80\" y=\"115\" width=\"370\" height=\"370\" viewBox=\"-100 -100 200 200\"" -}}
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="{{ index $colors "ground" }}"/>
{{ $inner | safeHTML }}
<text x="520" y="300" font-family="Hind, 'Segoe UI', system-ui, sans-serif" font-size="96" font-weight="600" fill="{{ index $colors "ink" }}">{{ $site.name }}</text>
<text x="520" y="370" font-family="Hind, 'Segoe UI', system-ui, sans-serif" font-size="40" fill="{{ index $colors "muted" }}">{{ $site.domain }}</text>
<text x="520" y="440" font-family="Hind, 'Segoe UI', system-ui, sans-serif" font-size="34" fill="{{ index $colors "muted" }}">Terraform providers as first-class Nix values</text>
</svg>
