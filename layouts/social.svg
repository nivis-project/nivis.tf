{{- /*
  The preview image, generated from the same mark partial as the favicon.

  SVG is an unusual choice for a social image and several platforms will not
  render it. The alternatives were worse: rasterising needs a new build
  dependency and failure mode, and a hand-exported PNG would be the one asset
  that silently stayed behind when the mark changed. Recorded in the README.
*/ -}}
{{- $site := hugo.Data.site -}}
{{- $svg := partial "mark.html" (dict "name" "nivis" "copies" 4) -}}
{{- $inner := partial "mark-inline-colours.html" (dict "svg" $svg "copies" 4) -}}
{{- $inner = replace $inner " aria-hidden=\"true\"" "" -}}
{{- $inner = replace $inner "<svg viewBox=\"-200 -200 400 400\"" "<svg x=\"80\" y=\"115\" width=\"370\" height=\"370\" viewBox=\"-200 -200 400 400\"" -}}
{{- $ui := dict -}}
{{- range hugo.Data.tokens.colors -}}
{{- if or (eq .name "ground") (eq .name "ink") (eq .name "muted") -}}
{{- $ui = merge $ui (dict .name .light) -}}
{{- end -}}
{{- end -}}
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="{{ index $ui "ground" }}"/>
{{ $inner | safeHTML }}
<text x="520" y="300" font-family="Hind, 'Segoe UI', system-ui, sans-serif" font-size="96" font-weight="600" fill="{{ index $ui "ink" }}">{{ $site.name }}</text>
<text x="520" y="370" font-family="Hind, 'Segoe UI', system-ui, sans-serif" font-size="40" fill="{{ index $ui "muted" }}">{{ $site.domain }}</text>
<text x="520" y="440" font-family="Hind, 'Segoe UI', system-ui, sans-serif" font-size="34" fill="{{ index $ui "muted" }}">Terraform providers as first-class Nix values</text>
</svg>
