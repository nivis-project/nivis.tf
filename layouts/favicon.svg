{{- /*
  The favicon is the full mark, generated by the same partial, so recolouring
  the tokens moves it too. A hand-exported icon would be the one mark that
  silently stayed behind.

  An SVG served as its own file cannot read the page's custom properties, so the
  values are inlined from the same token data. That means the favicon does not
  follow a reader's dark mode. Acceptable for 16 pixels of browser chrome; the
  alternative is shipping two.
*/ -}}
{{- $svg := partial "mark.html" (dict "name" "nivis" "variant" "full") -}}
{{- $colors := dict -}}
{{- range hugo.Data.tokens.colors -}}
{{- if hasPrefix .name "mark-" -}}
{{- $colors = merge $colors (dict .name .light) -}}
{{- end -}}
{{- end -}}
{{- $out := $svg -}}
{{- range $n, $v := $colors -}}
{{- $out = replace $out (printf "var(--%s)" $n) $v -}}
{{- end -}}
{{- /* A standalone SVG file needs the XML namespace, which inline SVG in an
       HTML page does not. aria-hidden is likewise an inline-only concern: on a
       file's root element it is invalid. The Nu validator caught both. */ -}}
{{- $out = replace $out "<svg viewBox=" "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=" -}}
{{- $out = replace $out " aria-hidden=\"true\"" "" -}}
{{- /* `replace` inserts text, it does not evaluate template syntax, so the
       accessible name has to be interpolated before it goes in. */ -}}
{{- /* In a standalone SVG document the accessible name is <title>, not
       aria-label, which the validator rejects on the root element. */ -}}
{{- $label := printf " role=\"img\"><title>%s</title" hugo.Data.site.name -}}
{{- $out = replace $out "\"-100 -100 200 200\">" (printf "\"-100 -100 200 200\"%s>" $label) -}}
{{ $out | safeHTML }}
