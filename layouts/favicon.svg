{{- /*
  The favicon is the mark, generated by the same partial as the page, so
  recolouring the span moves it too.

  A standalone SVG file needs the XML namespace, which inline SVG does not, and
  takes its accessible name from <title> rather than aria-label, which a
  document root does not allow. The Nu validator caught both.

  It cannot resolve custom properties either, so the colours are substituted
  from the same span tokens.css generates from.
*/ -}}
{{- $svg := partial "mark.html" (dict "name" "nivis" "copies" 4) -}}
{{- $out := partial "mark-inline-colours.html" (dict "svg" $svg "copies" 4) -}}
{{- $label := printf " role=\"img\"><title>%s</title" hugo.Data.site.name -}}
{{- $out = replace $out "<svg viewBox=" "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=" -}}
{{- $out = replace $out " aria-hidden=\"true\"" "" -}}
{{- $out = replace $out "\"-200 -200 400 400\">" (printf "\"-200 -200 400 400\"%s>" $label) -}}
{{ $out | safeHTML }}
