<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Title }}</title>
{{- with .Description }}
<meta name="description" content="{{ . }}">
{{- end }}
{{- $tokensSrc := resources.Get "css/tokens.css" }}
{{- if not $tokensSrc }}{{ errorf "assets/css/tokens.css is missing; the site cannot be styled without it" }}{{ end }}
{{- $tokens := $tokensSrc | resources.ExecuteAsTemplate "css/tokens.css" . }}
<link rel="stylesheet" href="{{ $tokens.RelPermalink }}">
